run:
  timeout: 8m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - goimports 
    - misspell
    - revive
    - unconvert
    - unparam
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  gosec:
    excludes:
      - G104

  misspell:
    locale: US

  revive:
    rules:
      - name: exported
        arguments: [true]

issues:
  exclude-dirs:
    - tmp
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - typecheck
    - text: "undefined:"
      linters:
        - typecheck
    - path: mocks\.go
      linters:
        - typecheck
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-results: true