run:
  timeout: 8m
  tests: true
  skip-dirs-use-default: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gosec
    - goimports 
    - misspell
    - revive
    - unconvert
    - unparam
    - whitespace
    - exportloopref
    - errname
    - durationcheck
    - contextcheck
    - tenv
    - tparallel

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  gosec:
    excludes:
      - G104

  misspell:
    locale: US

  revive:
    rules:
      - name: exported
        arguments: [true]

issues:
  exclude-dirs:
    - tmp
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-results: true

