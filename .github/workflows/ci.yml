name: CI – Pull Request Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x']  

    env:
      JWTSECRET: ${{ secrets.JWTSECRET || 'asdhoiudfhiuhdhakjshdouhehrfwhofnalsidhohdohowfhoewfdkshl' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true  

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      - name: Verify deps
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: go fmt check
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-ed:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run tests (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage >= 30%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub("%","",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 30) ? 1 : 0 }' || { echo "Coverage below 30%"; exit 1; }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58.0

      - name: Build application
        run: go build -o tmp/main ./cmd/api/main.go

      - name: Test Docker build
        run: docker build -t applytrack-test .

